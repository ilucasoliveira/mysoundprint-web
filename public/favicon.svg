<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Literal hex, not theme variables: a favicon is fetched on its own and
       never sees the page's stylesheet. -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a52"/>
      <stop offset="48%" stop-color="#fb3b6d"/>
      <stop offset="100%" stop-color="#a63ecb"/>
    </linearGradient>
  </defs>
  <rect x="6" y="19.5" width="10" height="25" rx="5" fill="url(#mark)"/>
  <rect x="20" y="11" width="10" height="42" rx="5" fill="url(#mark)"/>
  <rect x="34" y="4" width="10" height="56" rx="5" fill="url(#mark)"/>
  <rect x="48" y="14" width="10" height="36" rx="5" fill="url(#mark)"/>
</svg>
